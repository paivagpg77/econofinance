<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro - EconoFinance</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/app-shell.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">
                <img src="../econofinance-logo.svg" alt="EconoFinance">
                <span>EconoFinance</span>
            </div>
            <nav class="menu">
                <a href="../pages/dashboard.html" class="menu-item">
                    <span class="icon">📊</span> Painel
                </a>
                <a href="../pages/funcionarios.html" class="menu-item">
                    <span class="icon">👥</span> Funcionários
                </a>
                <a href="../pages/financeiro.html" class="menu-item active">
                    <span class="icon">💰</span> Financeiro
                </a>
                <a href="../pages/relatorios.html" class="menu-item">
                    <span class="icon">📈</span> Relatórios
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Financeiro</h1>
                <div>
                    <button class="btn-primary" onclick="abrirFormularioDespesa()">+ Despesa</button>
                    <button class="btn-primary" onclick="abrirFormularioReceita()">+ Receita</button>
                </div>
            </header>

            <div class="content">
                <!-- Abas -->
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem; border-bottom: 2px solid #e5e7eb;">
                    <button class="btn-tab active" onclick="mostrarDespesas()">Despesas</button>
                    <button class="btn-tab" onclick="mostrarReceitas()">Receitas</button>
                </div>

                <!-- DESPESAS -->
                <div id="secaoDespesas">
                    <!-- Formulário Despesa -->
                    <div id="formularioDespesa" class="card" style="display: none; margin-bottom: 2rem;">
                        <h2>Nova Despesa</h2>
                        <form onsubmit="salvarDespesa(event)">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <input type="text" id="descDespesa" placeholder="Descrição" required>
                                <select id="tipoDespesa" required>
                                    <option value="">Tipo</option>
                                    <option value="Fixa">Fixa</option>
                                    <option value="Variável">Variável</option>
                                    <option value="Investimento">Investimento</option>
                                </select>
                                <input type="number" id="valorDespesa" step="0.01" placeholder="Valor" required>
                                <input type="date" id="dataDespesa" required>
                                <input type="text" id="fornecedor" placeholder="Fornecedor">
                                <select id="statusDespesa">
                                    <option value="pendente">Pendente</option>
                                    <option value="pago">Pago</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-primary" style="margin-top: 1rem;">Salvar</button>
                            <button type="button" class="btn-secondary" onclick="fecharFormularioDespesa()" style="margin-top: 1rem;">Cancelar</button>
                        </form>
                    </div>

                    <!-- Tabela Despesas -->
                    <div class="card">
                        <h2>Despesas</h2>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Descrição</th>
                                        <th>Tipo</th>
                                        <th>Valor</th>
                                        <th>Data</th>
                                        <th>Fornecedor</th>
                                        <th>Status</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaDespesas">
                                    <tr><td colspan="7" style="text-align: center;">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- RECEITAS -->
                <div id="secaoReceitas" style="display: none;">
                    <!-- Formulário Receita -->
                    <div id="formularioReceita" class="card" style="display: none; margin-bottom: 2rem;">
                        <h2>Nova Receita</h2>
                        <form onsubmit="salvarReceita(event)">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                <input type="text" id="descReceita" placeholder="Descrição" required>
                                <select id="tipoReceita" required>
                                    <option value="">Tipo</option>
                                    <option value="Serviço">Serviço</option>
                                    <option value="Produto">Produto</option>
                                    <option value="Venda">Venda</option>
                                </select>
                                <input type="number" id="valorReceita" step="0.01" placeholder="Valor" required>
                                <input type="date" id="dataReceita" required>
                                <input type="text" id="cliente" placeholder="Cliente">
                                <select id="statusReceita">
                                    <option value="pendente">Pendente</option>
                                    <option value="recebido">Recebido</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-primary" style="margin-top: 1rem;">Salvar</button>
                            <button type="button" class="btn-secondary" onclick="fecharFormularioReceita()" style="margin-top: 1rem;">Cancelar</button>
                        </form>
                    </div>

                    <!-- Tabela Receitas -->
                    <div class="card">
                        <h2>Receitas</h2>
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Descrição</th>
                                        <th>Tipo</th>
                                        <th>Valor</th>
                                        <th>Data</th>
                                        <th>Cliente</th>
                                        <th>Status</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="tabelaReceitas">
                                    <tr><td colspan="7" style="text-align: center;">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/shell.js"></script>
    <script>
        const companyId = localStorage.getItem('companyId') || 'test-company';

        function mostrarDespesas() {
            document.getElementById('secaoDespesas').style.display = 'block';
            document.getElementById('secaoReceitas').style.display = 'none';
            document.querySelectorAll('.btn-tab')[0].classList.add('active');
            document.querySelectorAll('.btn-tab')[1].classList.remove('active');
        }

        function mostrarReceitas() {
            document.getElementById('secaoDespesas').style.display = 'none';
            document.getElementById('secaoReceitas').style.display = 'block';
            document.querySelectorAll('.btn-tab')[0].classList.remove('active');
            document.querySelectorAll('.btn-tab')[1].classList.add('active');
        }

        function abrirFormularioDespesa() { document.getElementById('formularioDespesa').style.display = 'block'; }
        function fecharFormularioDespesa() { document.getElementById('formularioDespesa').style.display = 'none'; }
        function abrirFormularioReceita() { document.getElementById('formularioReceita').style.display = 'block'; }
        function fecharFormularioReceita() { document.getElementById('formularioReceita').style.display = 'none'; }

        async function salvarDespesa(e) {
            e.preventDefault();
            const dados = {
                descricao: document.getElementById('descDespesa').value,
                tipo: document.getElementById('tipoDespesa').value,
                valor: parseFloat(document.getElementById('valorDespesa').value),
                dataDespesa: document.getElementById('dataDespesa').value,
                fornecedor: document.getElementById('fornecedor').value,
                status: document.getElementById('statusDespesa').value,
                companyId: companyId
            };
            try {
                await fetch('http://localhost:3000/api/financial/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                fecharFormularioDespesa();
                carregarDespesas();
            } catch (error) { console.error('Erro:', error); }
        }

        async function salvarReceita(e) {
            e.preventDefault();
            const dados = {
                descricao: document.getElementById('descReceita').value,
                tipo: document.getElementById('tipoReceita').value,
                valor: parseFloat(document.getElementById('valorReceita').value),
                dataReceita: document.getElementById('dataReceita').value,
                cliente: document.getElementById('cliente').value,
                status: document.getElementById('statusReceita').value,
                companyId: companyId
            };
            try {
                await fetch('http://localhost:3000/api/financial/revenues', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                fecharFormularioReceita();
                carregarReceitas();
            } catch (error) { console.error('Erro:', error); }
        }

        async function carregarDespesas() {
            try {
                const response = await fetch(`http://localhost:3000/api/financial/expenses/${companyId}`);
                const despesas = await response.json();
                const tbody = document.getElementById('tabelaDespesas');
                if (despesas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Nenhuma despesa</td></tr>';
                    return;
                }
                tbody.innerHTML = despesas.map(d => `
                    <tr>
                        <td>${d.descricao}</td>
                        <td>${d.tipo}</td>
                        <td>R$ ${parseFloat(d.valor).toFixed(2)}</td>
                        <td>${new Date(d.dataDespesa).toLocaleDateString('pt-BR')}</td>
                        <td>${d.fornecedor || '-'}</td>
                        <td><span class="badge" style="background: ${d.status === 'pago' ? '#10b981' : '#f59e0b'}">${d.status}</span></td>
                        <td><button class="btn-small" onclick="deletarDespesa('${d.id}')">Delete</button></td>
                    </tr>
                `).join('');
            } catch (error) { console.error('Erro:', error); }
        }

        async function carregarReceitas() {
            try {
                const response = await fetch(`http://localhost:3000/api/financial/revenues/${companyId}`);
                const receitas = await response.json();
                const tbody = document.getElementById('tabelaReceitas');
                if (receitas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">Nenhuma receita</td></tr>';
                    return;
                }
                tbody.innerHTML = receitas.map(r => `
                    <tr>
                        <td>${r.descricao}</td>
                        <td>${r.tipo}</td>
                        <td>R$ ${parseFloat(r.valor).toFixed(2)}</td>
                        <td>${new Date(r.dataReceita).toLocaleDateString('pt-BR')}</td>
                        <td>${r.cliente || '-'}</td>
                        <td><span class="badge" style="background: ${r.status === 'recebido' ? '#10b981' : '#f59e0b'}">${r.status}</span></td>
                        <td><button class="btn-small" onclick="deletarReceita('${r.id}')">Delete</button></td>
                    </tr>
                `).join('');
            } catch (error) { console.error('Erro:', error); }
        }

        async function deletarDespesa(id) {
            if (!confirm('Deletar?')) return;
            try { await fetch(`http://localhost:3000/api/financial/expenses/${id}`, { method: 'DELETE' }); carregarDespesas(); } catch (e) { console.error(e); }
        }

        async function deletarReceita(id) {
            if (!confirm('Deletar?')) return;
            try { await fetch(`http://localhost:3000/api/financial/revenues/${id}`, { method: 'DELETE' }); carregarReceitas(); } catch (e) { console.error(e); }
        }

        carregarDespesas();
        carregarReceitas();
    </script>

    <style>
        .table-responsive { overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .table th, .table td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .table th { background: #f9fafb; font-weight: 600; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; color: white; font-size: 0.875rem; }
        .btn-small { padding: 0.25rem 0.75rem; font-size: 0.875rem; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-small:hover { background: #dc2626; }
        .btn-tab { background: none; border: none; padding: 1rem; cursor: pointer; font-size: 1rem; color: #6b7280; border-bottom: 2px solid transparent; }
        .btn-tab.active { color: #667eea; border-bottom-color: #667eea; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
    </style>
</body>
</html>
