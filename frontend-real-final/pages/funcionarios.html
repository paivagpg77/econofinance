<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionários - EconoFinance</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/app-shell.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">
                <img src="../econofinance-logo.svg" alt="EconoFinance">
                <span>EconoFinance</span>
            </div>
            <nav class="menu">
                <a href="../pages/dashboard.html" class="menu-item">
                    <span class="icon">📊</span> Painel
                </a>
                <a href="../pages/funcionarios.html" class="menu-item active">
                    <span class="icon">👥</span> Funcionários
                </a>
                <a href="../pages/financeiro.html" class="menu-item">
                    <span class="icon">💰</span> Financeiro
                </a>
                <a href="../pages/relatorios.html" class="menu-item">
                    <span class="icon">📈</span> Relatórios
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Funcionários</h1>
                <button class="btn-primary" onclick="abrirFormulario()">+ Adicionar Funcionário</button>
            </header>

            <div class="content">
                <!-- Formulário -->
                <div id="formulario" class="card" style="display: none; margin-bottom: 2rem;">
                    <h2>Novo Funcionário</h2>
                    <form onsubmit="salvarFuncionario(event)">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div>
                                <label>Nome</label>
                                <input type="text" id="nome" required>
                            </div>
                            <div>
                                <label>Email</label>
                                <input type="email" id="email">
                            </div>
                            <div>
                                <label>Cargo</label>
                                <input type="text" id="cargo" required>
                            </div>
                            <div>
                                <label>Salário Base</label>
                                <input type="number" id="salarioBase" step="0.01" required>
                            </div>
                            <div>
                                <label>Data Admissão</label>
                                <input type="date" id="dataAdmissao" required>
                            </div>
                            <div>
                                <label>Vale Refeição</label>
                                <input type="number" id="valeRefeicao" step="0.01" value="0">
                            </div>
                            <div>
                                <label>Vale Transporte</label>
                                <input type="number" id="valeTransporte" step="0.01" value="0">
                            </div>
                        </div>
                        <div style="margin-top: 1rem;">
                            <button type="submit" class="btn-primary">Salvar</button>
                            <button type="button" class="btn-secondary" onclick="fecharFormulario()">Cancelar</button>
                        </div>
                    </form>
                </div>

                <!-- Tabela -->
                <div class="card">
                    <h2>Lista de Funcionários</h2>
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Cargo</th>
                                    <th>Salário</th>
                                    <th>Data Admissão</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaFuncionarios">
                                <tr><td colspan="6" style="text-align: center;">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/shell.js"></script>
    <script>
        const companyId = localStorage.getItem('companyId') || 'test-company';

        function abrirFormulario() {
            document.getElementById('formulario').style.display = 'block';
        }

        function fecharFormulario() {
            document.getElementById('formulario').style.display = 'none';
            document.getElementById('nome').value = '';
            document.getElementById('email').value = '';
            document.getElementById('cargo').value = '';
            document.getElementById('salarioBase').value = '';
            document.getElementById('dataAdmissao').value = '';
            document.getElementById('valeRefeicao').value = '0';
            document.getElementById('valeTransporte').value = '0';
        }

        async function salvarFuncionario(e) {
            e.preventDefault();
            const dados = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                cargo: document.getElementById('cargo').value,
                salarioBase: parseFloat(document.getElementById('salarioBase').value),
                dataAdmissao: document.getElementById('dataAdmissao').value,
                valeRefeicao: parseFloat(document.getElementById('valeRefeicao').value),
                valeTransporte: parseFloat(document.getElementById('valeTransporte').value),
                companyId: companyId
            };

            try {
                await fetch('http://localhost:3000/api/employees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                fecharFormulario();
                carregarFuncionarios();
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function carregarFuncionarios() {
            try {
                const response = await fetch(`http://localhost:3000/api/employees/${companyId}`);
                const funcionarios = await response.json();
                
                const tbody = document.getElementById('tabelaFuncionarios');
                if (funcionarios.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nenhum funcionário encontrado</td></tr>';
                    return;
                }

                tbody.innerHTML = funcionarios.map(f => `
                    <tr>
                        <td>${f.nome}</td>
                        <td>${f.cargo}</td>
                        <td>R$ ${parseFloat(f.salarioBase).toFixed(2)}</td>
                        <td>${new Date(f.dataAdmissao).toLocaleDateString('pt-BR')}</td>
                        <td><span class="badge" style="background: #10b981;">${f.status}</span></td>
                        <td>
                            <button class="btn-small" onclick="deletarFuncionario('${f.id}')">Deletar</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        async function deletarFuncionario(id) {
            if (!confirm('Tem certeza?')) return;
            try {
                await fetch(`http://localhost:3000/api/employees/${id}`, { method: 'DELETE' });
                carregarFuncionarios();
            } catch (error) {
                console.error('Erro:', error);
            }
        }

        carregarFuncionarios();
    </script>

    <style>
        .table-responsive { overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .table th, .table td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .table th { background: #f9fafb; font-weight: 600; }
        .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; color: white; font-size: 0.875rem; }
        .btn-small { padding: 0.25rem 0.75rem; font-size: 0.875rem; background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-small:hover { background: #dc2626; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 600; }
    </style>
</body>
</html>
