<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro — EconoFinance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/app-shell.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/module.css">
</head>
<body>
<div id="app"></div>

<div id="modalForm" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <h2>Novo lançamento</h2>
    <div id="alertaForm" class="alert"></div>
    <form id="formTransacao">
      <label>Tipo</label>
      <select id="tipo" required>
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>
      <label>Categoria</label>
      <input type="text" id="categoria" placeholder="Ex: Venda de produtos, Aluguel, Fornecedores" required>
      <label>Valor (R$)</label>
      <input type="number" id="valor" min="0" step="0.01" required>
      <label>Data</label>
      <input type="date" id="data" required>
      <label>Descrição (opcional)</label>
      <input type="text" id="descricao">
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/shell.js"></script>
<script>
  Auth.exigirLogin();
  renderShell({ active: 'financeiro', title: 'Financeiro' });

  document.getElementById('topbarActions').innerHTML =
    `<button class="btn btn-primary" onclick="abrirModal()">+ Novo lançamento</button>`;

  document.getElementById('pageContent').innerHTML = `
    <div class="module-toolbar">
      <div class="empresa-selector">
        Empresa: <select id="seletorEmpresa"></select>
      </div>
    </div>
    <div id="alertaPagina" class="alert"></div>
    <div class="kpi-row" id="kpiRow"></div>
    <h2 class="section-title">Lançamentos</h2>
    <div id="tabelaContainer"></div>
  `;

  let companyIdAtual = null;

  async function carregarTudo(companyId) {
    companyIdAtual = companyId;
    if (!companyId) return;

    try {
      const [resumo, transacoes] = await Promise.all([
        Financeiro.resumo(companyId),
        Financeiro.listar(companyId),
      ]);

      const saldoPositivo = Number(resumo.saldo) >= 0;

      document.getElementById('kpiRow').innerHTML = `
        <div class="kpi-card"><div class="kpi-label">Total receitas</div><div class="kpi-value">R$ ${Number(resumo.totalReceitas).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div></div>
        <div class="kpi-card"><div class="kpi-label">Total despesas</div><div class="kpi-value">R$ ${Number(resumo.totalDespesas).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div></div>
        <div class="kpi-card"><div class="kpi-label">Saldo</div><div class="kpi-value" style="color:${saldoPositivo ? 'var(--primary-700)' : 'var(--danger)'}">R$ ${Number(resumo.saldo).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div></div>
      `;

      const container = document.getElementById('tabelaContainer');
      if (transacoes.length === 0) {
        container.innerHTML = `<div class="empty-state">Nenhum lançamento registrado ainda para esta empresa.</div>`;
        return;
      }

      container.innerHTML = `
        <table class="data-table">
          <thead><tr><th>Data</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th>Status</th></tr></thead>
          <tbody>
            ${transacoes.map((t) => `
              <tr>
                <td>${new Date(t.data).toLocaleDateString('pt-BR')}</td>
                <td>${t.categoria}${t.descricao ? ` <span style="color:var(--muted); font-size:12.5px;">— ${t.descricao}</span>` : ''}</td>
                <td><span class="tag-pill tag-${t.tipo}">${t.tipo}</span></td>
                <td class="mono">R$ ${Number(t.valor).toFixed(2)}</td>
                <td><span class="tag-pill tag-${t.status}">${t.status}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      mostrarAlerta('alertaPagina', err.message, 'error');
    }
  }

  montarSeletorEmpresa('seletorEmpresa', carregarTudo);

  function abrirModal() {
    document.getElementById('formTransacao').reset();
    document.getElementById('alertaForm').className = 'alert';
    document.getElementById('modalForm').style.display = 'flex';
  }
  function fecharModal() {
    document.getElementById('modalForm').style.display = 'none';
  }

  document.getElementById('formTransacao').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    try {
      await Financeiro.criar(companyIdAtual, {
        tipo: document.getElementById('tipo').value,
        categoria: document.getElementById('categoria').value.trim(),
        valor: parseFloat(document.getElementById('valor').value),
        data: document.getElementById('data').value,
        descricao: document.getElementById('descricao').value.trim() || undefined,
      });
      fecharModal();
      carregarTudo(companyIdAtual);
    } catch (err) {
      mostrarAlerta('alertaForm', err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Salvar';
    }
  });
</script>
</body>
</html>
